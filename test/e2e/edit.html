<!doctype html>
<html>
<head>
	<meta charset="UTF-8" />
	<title>Tabulator Edit Test</title>
	<link rel="stylesheet" href="../../dist/css/tabulator.min.css" />
	<script src="../../dist/js/tabulator.js"></script>
	<style>
	body {
		padding: 20px;
		font-family: Arial, sans-serif;
	}
	#test-table {
		width: 100%;
		height: 400px;
	}
	</style>
</head>
<body>
	<h1>Tabulator Edit Test</h1>
	<div id="test-table"></div>

	<script>
	document.addEventListener("DOMContentLoaded", function () {
		// a custom editor that leaves committing on blur to the table, as in
		// https://github.com/tabulator-tables/tabulator/issues/4716
		function passiveEditor(cell, onRendered, success){
			const input = document.createElement("input");

			input.value = cell.getValue();
			input.setAttribute("data-passive-editor", "true");

			onRendered(function(){
				input.focus();
			});

			input.addEventListener("change", function(){
				success(input.value);
			});

			return input;
		}

		window.testTable = new Tabulator("#test-table", {
			data: [
				{ id: 1, name: "Alice", age: 25, city: "New York", code: "AA" },
				{ id: 2, name: "Bob", age: 32, city: "Chicago", code: "BB" },
			],
			columns: [
				{ title: "ID", field: "id" },
				{ title: "Name", field: "name", editor: passiveEditor },
				{ title: "Age", field: "age", editor: passiveEditor },
				{ title: "City", field: "city", editor: passiveEditor },
				{ title: "Code", field: "code", editor: passiveEditor, validator: "required" },
			],
		});
	});
	</script>
</body>
</html>
